name: Solarcord Automatic Release

on:
    push:
        branches:
            - main
    workflow_dispatch:

env:
    FORCE_COLOR: true
    USERNAME: GitHub-Actions

permissions:
    contents: write

jobs:
    Build:
        name: Build and Release Solarcord
        runs-on: ubuntu-latest

        steps:
            - name: Checkout repository
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

            - name: Setup PNPM
              uses: pnpm/setup@fa36a5ef7dcdefc3a7cb25655c122e00cf6e636e # v3.1.2
              with:
                  runtime: node@v24
                  require-lockfile: true

            - name: Build web
              run: pnpm buildWebStandalone

            - name: Build
              run: pnpm buildStandalone

            - name: Generate plugin lists
              run: |
                  pnpm generatePluginJson dist/plugins.json
                  pnpm generateEquicordPluginJson dist/equicordplugins.json
                  pnpm generateVencordPluginJson dist/vencordplugins.json
                  pnpm generateDevsList dist/devs.json

            - name: Collect files to be released
              run: |
                  cd dist
                  mkdir release

                  cp browser/browser.* release 2>/dev/null || true
                  cp Equicord.user.{js,js.LEGAL.txt} release 2>/dev/null || true

                  # Copia i plugin json, gli zip delle estensioni e i file asar
                  cp *.{json,zip,asar} release 2>/dev/null || true

                  # Copia eventuali file desktop
                  cp desktop/* release 2>/dev/null || true
                  for file in equibop/*; do
                    if [ -f "$file" ]; then
                      filename=$(basename "$file")
                      cp "$file" "release/equibop${filename^}"
                    fi
                  done

                  find release -size 0 -delete
                  rm -f release/package.json
                  rm -f release/*.map

            - name: Create Linux Zip Bundle
              run: |
                  cd dist/release
                  zip -r ../../solarcord-build-linux.zip ./*

            - name: Upload to GitHub Releases
              uses: softprops/action-gh-release@v2
              with:
                  tag_name: "latest"
                  name: "latest"
                  body: "Build automatica aggiornata all'ultimo commit di `main`."
                  files: |
                      solarcord-build-linux.zip
                      dist/release/*
                  overwrite: true
                  prerelease: false
              env:
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
